<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — EduNest</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>
    <div class="app-main">
      <div class="container">
        <div id="alertBox"></div>
        <div class="dashboard-grid">
          <div>
            <div class="panel" id="profilePanel">
              <p class="muted" data-i18n="loading">Yuklanmoqda...</p>
            </div>

            <div class="panel" style="margin-top:16px;" id="telegramPanel">
              <h3 data-i18n="telegram_title">🤖 Telegram bot</h3>
              <p class="muted" data-i18n="telegram_desc">Bildirishnomalarni Telegram orqali olish uchun akkauntingizni bog'lang.</p>
              <button id="telegramLinkBtn" class="btn btn-primary btn-block" data-i18n="telegram_link_btn">Telegram botga ulash</button>
              <div id="telegramLinkResult"></div>
            </div>
          </div>

          <div>
            <div class="panel">
              <h3 data-i18n="my_courses">📚 Mening kurslarim</h3>
              <div id="myCourses"><p class="muted" data-i18n="loading">Yuklanmoqda...</p></div>
            </div>

            <div class="panel" style="margin-top:16px;">
              <h3 data-i18n="notifications_title">🔔 Bildirishnomalar</h3>
              <div id="notificationsList"><p class="muted" data-i18n="loading">Yuklanmoqda...</p></div>
            </div>

            <div class="panel" style="margin-top:16px;">
              <h3 data-i18n="certificates_title">🎓 Sertifikatlarim</h3>
              <div id="certificatesList"><p class="muted" data-i18n="loading">Yuklanmoqda...</p></div>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">© 2026 EduNest — Online Ta'lim Platformasi</div>
    </div>
  </div>

  <script type="module" src="js/pages/dashboard.js"></script>
  <script type="module" src="js/ai-chat.js"></script>
</body>
</html>
