<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kurs yaratish — EduNest</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="auth-wrapper" style="max-width:560px;">
    <h2>Yangi kurs yaratish 📘</h2>
    <p class="muted">Kurs yaratilgach, admin tasdiqlagandan so'ng u ommaviy ro'yxatda ko'rinadi.</p>
    <div id="alertBox"></div>
    <form id="courseForm">
      <div class="form-group">
        <label for="title">Kurs nomi</label>
        <input type="text" id="title" required />
      </div>
      <div class="form-group">
        <label for="description">Tavsif</label>
        <textarea id="description" required></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="price">Narxi (so'm, 0 = bepul)</label>
          <input type="number" id="price" min="0" step="1000" value="0" required />
        </div>
        <div class="form-group">
          <label for="level">Daraja</label>
          <select id="level">
            <option value="beginner">Boshlang'ich</option>
            <option value="intermediate">O'rta</option>
            <option value="advanced">Yuqori</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="category">Kategoriya</label>
        <select id="category">
          <option value="">Tanlanmagan</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Kurs yaratish</button>
    </form>
  </div>

  <script type="module" src="js/pages/create-course.js"></script>
</body>
</html>
