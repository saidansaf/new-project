<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>try{if(localStorage.getItem('edunest_theme')==='dark')document.documentElement.classList.add('dark-theme');}catch(e){}</script>
  <title>Kurs yaratish — EduNest</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>
    <div class="app-main">
      <div class="auth-wrapper" style="max-width:560px;">
        <h2 data-i18n="create_course_title">Yangi kurs yaratish 📘</h2>
        <p class="muted" data-i18n="create_course_desc">Kurs yaratilgach, admin tasdiqlagandan so'ng u ommaviy ro'yxatda ko'rinadi.</p>
        <div id="alertBox"></div>
        <form id="courseForm">
          <div class="form-group">
            <label for="title" data-i18n="course_name">Kurs nomi</label>
            <input type="text" id="title" required />
          </div>
          <div class="form-group">
            <label for="description" data-i18n="description_label">Tavsif</label>
            <textarea id="description" required></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="price" data-i18n="price_label">Narxi (so'm, 0 = bepul)</label>
              <input type="number" id="price" min="0" step="1000" value="0" required />
            </div>
            <div class="form-group">
              <label for="level" data-i18n="level_label">Daraja</label>
              <select id="level">
                <option value="beginner" data-i18n="level_beginner">Boshlang'ich</option>
                <option value="intermediate" data-i18n="level_intermediate">O'rta</option>
                <option value="advanced" data-i18n="level_advanced">Yuqori</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="category" data-i18n="category_label">Kategoriya</label>
            <select id="category">
              <option value="" data-i18n="not_selected">Tanlanmagan</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="submitBtn" data-i18n="create_course">Kurs yaratish</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/create-course.js"></script>
  <script type="module" src="js/ai-chat.js"></script>
</body>
</html>
