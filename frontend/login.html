<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>try{if(localStorage.getItem('edunest_theme')==='dark')document.documentElement.classList.add('dark-theme');}catch(e){}</script>
  <title>Kirish — EduNest</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="auth-wrapper">
    <h2 data-i18n="welcome_title">Xush kelibsiz 👋</h2>
    <div id="alertBox"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username" data-i18n="username_label">Foydalanuvchi nomi</label>
        <input type="text" id="username" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password" data-i18n="password_label">Parol</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn" data-i18n="login_btn">Kirish</button>
    </form>
    <div class="form-footer">
      <span data-i18n="no_account">Akkountingiz yo'qmi?</span> <a href="register.html" data-i18n="register_link">Ro'yxatdan o'ting</a>
    </div>
  </div>

  <script type="module" src="js/pages/login.js"></script>
  <script type="module" src="js/ai-chat.js"></script>
</body>
</html>
