<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>try{if(localStorage.getItem('edunest_theme')==='dark')document.documentElement.classList.add('dark-theme');}catch(e){}</script>
  <title>Typing Test — EduNest</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .typing-wrap { max-width: 900px; margin: 0 auto; }

    .typing-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin: 24px 0 12px;
      padding: 10px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 999px;
    }

    .typing-toggles, .typing-modes, .typing-options { display: flex; gap: 4px; flex-wrap: wrap; }

    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .chip:hover { color: var(--color-text); }
    .chip.active { background: var(--color-primary); color: #fff; }
    .typing-modes { padding: 0 8px; border-left: 1px solid var(--color-border); border-right: 1px solid var(--color-border); }

    .typing-lang-badge {
      text-align: center;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--color-text-muted);
      cursor: pointer;
    }
    .typing-lang-badge:hover { color: var(--color-primary); }

    .typing-stats {
      display: flex;
      gap: 24px;
      font-weight: 800;
      justify-content: center;
      margin-bottom: 12px;
    }
    .typing-stats div { text-align: center; }
    .typing-stats span:first-child { color: var(--color-text-muted); font-size: 11px; font-weight: 600; display: block; text-transform: uppercase; }
    .typing-stats span:last-child { font-size: 26px; color: var(--color-primary); }

    .typing-board {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 28px;
      font-size: 22px;
      line-height: 1.8;
      letter-spacing: 0.5px;
      font-family: 'Courier New', monospace;
      user-select: none;
      cursor: text;
      min-height: 140px;
      max-height: 240px;
      overflow-y: auto;
      overflow-wrap: break-word;
      word-break: break-word;
    }
    .typing-board .char { color: var(--color-text-muted); }
    .typing-board .char.correct { color: var(--color-success); }
    .typing-board .char.incorrect { color: var(--color-danger); text-decoration: underline; }
    .typing-board .char.current { background: var(--color-primary-light); border-radius: 3px; }
    .typing-board.zen-board { white-space: pre-wrap; color: var(--color-text); }
    #typingHiddenInput { position: absolute; opacity: 0; pointer-events: none; }
    #customTextArea {
      width: 100%; min-height: 100px; margin-bottom: 12px; padding: 12px;
      border-radius: var(--radius); border: 1px solid var(--color-border);
      background: var(--color-surface); color: var(--color-text); font-family: inherit; font-size: 14px;
    }
    .typing-result {
      text-align: center; padding: 40px 20px; background: var(--color-surface);
      border: 1px solid var(--color-border); border-radius: var(--radius);
    }
    .typing-result .big { font-size: 48px; font-weight: 800; color: var(--color-primary); }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--color-border); font-size: 14px; }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-badge { font-weight: 800; color: var(--color-text-muted); width: 24px; display: inline-block; }

    @media (max-width: 720px) {
      .typing-toolbar { justify-content: center; border-radius: var(--radius); }
      .typing-modes { border-left: none; border-right: none; order: -1; width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>
    <div class="app-main">
      <div class="container typing-wrap">
        <div class="typing-toolbar">
          <div class="typing-toggles">
            <button class="chip" id="togglePunctuation" type="button">@ <span data-i18n="typing_punctuation">punctuation</span></button>
            <button class="chip" id="toggleNumbers" type="button"># <span data-i18n="typing_numbers">numbers</span></button>
          </div>
          <div class="typing-modes" id="modeTabs">
            <button class="chip active" data-mode="time" type="button">⏱ <span data-i18n="typing_mode_time">time</span></button>
            <button class="chip" data-mode="words" type="button">A <span data-i18n="typing_mode_words">words</span></button>
            <button class="chip" data-mode="quote" type="button">" <span data-i18n="typing_mode_quote">quote</span></button>
            <button class="chip" data-mode="zen" type="button">⚠ <span data-i18n="typing_mode_zen">zen</span></button>
            <button class="chip" data-mode="custom" type="button">🔧 <span data-i18n="typing_mode_custom">custom</span></button>
          </div>
          <div class="typing-options" id="optionsRow"></div>
        </div>

        <div class="typing-lang-badge" id="langBadge">🌐 uzbek</div>

        <div class="typing-stats">
          <div><span data-i18n="typing_time">Vaqt</span><span id="timeLeft">30</span></div>
          <div><span>WPM</span><span id="liveWpm">0</span></div>
        </div>

        <div id="customTextWrap" hidden>
          <textarea id="customTextArea" data-i18n-placeholder="typing_custom_placeholder" placeholder="O'z matningizni shu yerga joylashtiring..."></textarea>
        </div>

        <div id="typingArea">
          <div id="typingBoard" class="typing-board"></div>
          <input id="typingHiddenInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
          <div class="form-footer">
            <span data-i18n="typing_start_hint">Boshlash uchun matnga bosing va yozishni boshlang.</span>
            <button id="restartBtn" class="btn btn-ghost btn-sm" data-i18n="typing_restart">🔄 Qayta boshlash</button>
            <button id="zenFinishBtn" class="btn btn-primary btn-sm" data-i18n="typing_finish" hidden>✅ Tugatish</button>
          </div>
        </div>

        <div id="resultArea" hidden></div>

        <h3 style="margin-top:36px;"><span data-i18n="typing_leaderboard">🏆 TOP-10</span> (<span id="lbDurationLabel">30</span>s)</h3>
        <div id="leaderboard" class="panel"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/typing-test.js"></script>
  <script type="module" src="js/ai-chat.js"></script>
</body>
</html>
