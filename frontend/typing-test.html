<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Test — EduNest</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body.typing-dark {
      --color-bg: #0f172a;
      --color-surface: #1e293b;
      --color-border: #334155;
      --color-text: #e2e8f0;
      --color-text-muted: #94a3b8;
    }
    .typing-wrap { max-width: 820px; margin: 0 auto; }
    .typing-toolbar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
      margin: 24px 0 16px;
    }
    .typing-options { display: flex; gap: 6px; }
    .typing-option {
      padding: 6px 14px; border-radius: 8px; border: 1px solid var(--color-border);
      cursor: pointer; font-weight: 700; font-size: 14px; background: var(--color-surface);
    }
    .typing-option.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .typing-stats { display: flex; gap: 20px; font-weight: 800; font-size: 20px; }
    .typing-stats span { color: var(--color-text-muted); font-size: 12px; font-weight: 600; display: block; }
    .typing-board {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 28px;
      font-size: 22px;
      line-height: 1.8;
      letter-spacing: 0.5px;
      font-family: 'Courier New', monospace;
      user-select: none;
      cursor: text;
      min-height: 140px;
    }
    .typing-board .char { color: var(--color-text-muted); }
    .typing-board .char.correct { color: var(--color-success); }
    .typing-board .char.incorrect { color: var(--color-danger); text-decoration: underline; }
    .typing-board .char.current { background: var(--color-primary-light); border-radius: 3px; }
    #typingHiddenInput { position: absolute; opacity: 0; pointer-events: none; }
    .typing-result {
      text-align: center; padding: 40px 20px; background: var(--color-surface);
      border: 1px solid var(--color-border); border-radius: var(--radius);
    }
    .typing-result .big { font-size: 48px; font-weight: 800; color: var(--color-primary); }
    .leaderboard-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--color-border); font-size: 14px; }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-badge { font-weight: 800; color: var(--color-text-muted); width: 24px; display: inline-block; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>
    <div class="app-main">
      <div class="container typing-wrap">
        <div class="typing-toolbar">
          <div class="typing-options" id="durationOptions">
            <div class="typing-option" data-duration="15">15s</div>
            <div class="typing-option active" data-duration="30">30s</div>
            <div class="typing-option" data-duration="60">60s</div>
            <div class="typing-option" data-duration="120">120s</div>
          </div>
          <div class="typing-stats">
            <div><span>Vaqt</span><span id="timeLeft" style="font-size:20px;color:var(--color-text);">30</span></div>
            <div><span>WPM</span><span id="liveWpm" style="font-size:20px;color:var(--color-text);">0</span></div>
          </div>
          <button id="themeToggle" class="btn btn-outline btn-sm">🌙 Qora rejim</button>
        </div>

        <div id="typingArea">
          <div id="typingBoard" class="typing-board"></div>
          <input id="typingHiddenInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
          <div class="form-footer">Boshlash uchun matnga bosing va yozishni boshlang. <button id="restartBtn" class="btn btn-ghost btn-sm">🔄 Qayta boshlash</button></div>
        </div>

        <div id="resultArea" hidden></div>

        <h3 style="margin-top:36px;">🏆 TOP-10 (<span id="lbDurationLabel">30</span>s)</h3>
        <div id="leaderboard" class="panel"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/pages/typing-test.js"></script>
  <script type="module" src="js/ai-chat.js"></script>
</body>
</html>
