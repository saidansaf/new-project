services:
  # --- Bitta xizmat: Django backend + Telegram bot (bir konteynerda) ---
  # Celery fon vazifalar CELERY_TASK_ALWAYS_EAGER=True orqali sinxron bajariladi,
  # chunki Render bepul tarifida alohida Background Worker mavjud emas.
  - type: web
    name: edunest-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false  # Tashqi Postgres (masalan Neon.tech) ulanish manzili shu yerga qo'yiladi
      - key: REDIS_URL
        fromService:
          name: edunest-redis
          type: redis
          property: connectionString
      - key: USE_REDIS_CHANNEL_LAYER
        value: "True"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: BOT_TOKEN
        sync: false
      - key: BOT_API_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_USERNAME
        value: edu_saidansaf_bot
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # --- Redis (kesh, Channels layer) ---
  - type: redis
    name: edunest-redis
    plan: free
    ipAllowList: []
