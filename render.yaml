databases:
  - name: edunest-db
    plan: free
    databaseName: edunest
    user: edunest

services:
  # --- Django backend (web, Dockerfile orqali) ---
  - type: web
    name: edunest-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: edunest-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: edunest-redis
          type: redis
          property: connectionString
      - key: USE_REDIS_CHANNEL_LAYER
        value: "True"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: BOT_API_SECRET
        sync: false
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # --- Celery worker (fon vazifalar) ---
  - type: worker
    name: edunest-celery-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config worker -l info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edunest-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: edunest-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        sync: false

  # --- Celery beat (rejalashtirilgan vazifalar) ---
  - type: worker
    name: edunest-celery-beat
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A config beat -l info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edunest-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: edunest-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        sync: false

  # --- Telegram bot (polling rejimida background worker) ---
  - type: worker
    name: edunest-bot
    runtime: docker
    dockerfilePath: ./bot/Dockerfile
    dockerContext: ./bot
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_BASE_URL
        sync: false  # backend deploy bo'lgach, uning https://...onrender.com manzilini shu yerga qo'yasiz
      - key: BOT_API_SECRET
        sync: false

  # --- Redis (kesh, Celery broker, Channels layer) ---
  - type: redis
    name: edunest-redis
    plan: free
    ipAllowList: []
